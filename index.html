<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Expenses</title>
<style>
:root{--bg:#F3F8F6;--card:#fff;--ink:#2F4858;--mute:#7D919B;--line:#E2EDE9;--acc:#8CCBB4;--accInk:#1E3A32;--accText:#3F8B74;--red:#D9826F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12201D;--card:#1B2B27;--ink:#E6F0EC;--mute:#8CA39B;--line:#2A3D38;--acc:#7FC7AE;--accInk:#0E2A22;--accText:#8FD6BE;--red:#F0917F}}
:root[data-theme="dark"]{--bg:#12201D;--card:#1B2B27;--ink:#E6F0EC;--mute:#8CA39B;--line:#2A3D38;--acc:#7FC7AE;--accInk:#0E2A22;--accText:#8FD6BE;--red:#F0917F}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:16px 16px 150px}
.nav{display:flex;align-items:center;justify-content:space-between}
.nav button{background:none;border:0;color:var(--ink);font-size:26px;padding:6px 14px;cursor:pointer}
.nav b{font-size:17px;font-weight:600}
.total{text-align:center;margin:14px 0 22px}
.total .n{font-size:52px;font-weight:700;letter-spacing:-1.5px;line-height:1.1}
.total .l{color:var(--mute);font-size:15px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:16px;border:1px solid var(--line)}
.bar{margin:10px 0}
.bar .t{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.bar .t span:last-child{color:var(--mute)}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--acc);border-radius:4px}
h2{font-size:15px;font-weight:600;color:var(--mute);margin:20px 4px 8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .m{flex:1;min-width:0}
.row .m div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m div:last-child{font-size:14px;color:var(--mute)}
.row .a{font-weight:600;font-variant-numeric:tabular-nums}
.row .x{background:none;border:0;color:var(--mute);font-size:20px;padding:4px 8px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;height:54px;border:0;border-radius:27px;background:var(--acc);color:var(--accInk);font:600 17px inherit;font-family:inherit;cursor:pointer;box-shadow:0 8px 20px rgba(90,160,140,.35)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet label{display:block;font-size:14px;color:var(--mute);margin:12px 0 5px}
.sheet input{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sheet input.amt{font-size:32px;font-weight:700;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.save{width:100%;margin-top:18px;height:50px;border:0;border-radius:14px;background:var(--acc);color:var(--accInk);font:600 17px inherit;font-family:inherit;cursor:pointer}
.cancel{width:100%;margin-top:6px;height:44px;border:0;background:none;color:var(--mute);font:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.top h1{font-size:20px;margin:0;font-weight:700}
.burger{background:none;border:0;color:var(--ink);padding:10px;margin-left:-10px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.burger i{display:block;width:22px;height:2.5px;border-radius:2px;background:var(--ink)}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:8}
.drawer-bg.on{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:260px;max-width:80%;background:var(--card);z-index:9;transform:translateX(-100%);transition:transform .2s;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px}
.drawer.on{transform:none}
.drawer h3{margin:4px 12px 14px;font-size:18px}
.drawer button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:18px;padding:13px 12px;border-radius:12px;cursor:pointer}
.drawer button.on{background:var(--bg);font-weight:600;color:var(--accText)}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
#notes{display:none}
#notes textarea{width:100%;height:65vh;min-height:300px;resize:none;font:inherit;font-size:16px;line-height:1.5;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#notes .s{text-align:right;font-size:13px;color:var(--mute);margin:6px 4px}
.save{background:#CFE6DE;color:#5E8B7D;font-size:18px;transition:background .2s,color .2s,box-shadow .2s}
.save.ready{background:#2F7A64;color:#fff;box-shadow:0 6px 16px rgba(47,122,100,.35)}
.fab{background:#2F7A64;color:#fff;font-size:18px;box-shadow:0 8px 20px rgba(47,122,100,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .save{background:var(--line);color:var(--mute)}:root:not([data-theme="light"]) .save.ready{background:#4FB79C;color:#08201A}}
:root[data-theme="dark"] .save{background:var(--line);color:var(--mute)}
:root[data-theme="dark"] .save.ready{background:#4FB79C;color:#08201A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{background:#4FB79C;color:#08201A}}
:root[data-theme="dark"] .fab{background:#4FB79C;color:#08201A}
button{transition:transform .12s}
button:active{transform:scale(.96)}
.fill{transition:width .5s ease}
.bar{cursor:pointer;border-radius:10px;padding:4px 8px;margin:6px -8px;transition:background .15s}
.bar.on{background:var(--bg)}
.hint{font-size:13px;color:var(--mute);text-align:center;margin-top:6px}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.sheet{animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.row{transition:opacity .25s,transform .25s}
.row.out{opacity:0;transform:translateX(30px)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.filt{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--mute);margin:4px 4px 0}
.filt button{background:none;border:0;color:var(--accText);font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bill-row{gap:8px}
.bill-status{display:flex;flex-direction:column;gap:2px;flex:none;font-size:12px;color:var(--mute)}
.bill-status label{display:flex;align-items:center;gap:3px;white-space:nowrap}
.bill-status input{margin:0;accent-color:#2F7A64}
.bill-amount{display:flex;align-items:center;gap:3px;flex:none;font-weight:600}
.bill-amount input{width:88px;padding:7px 5px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.bill-summary{text-align:center;color:var(--mute);font-size:14px;margin:-14px 0 16px}
.bill-summary strong{color:var(--ink);font-weight:600}
.bill-meta.overdue{color:var(--red)!important;font-weight:600}
.chart-head{font-size:15px;font-weight:600;color:var(--mute);margin:0 0 12px}
.chart-layout{display:grid;grid-template-columns:160px minmax(0,1fr);align-items:center;gap:12px}
.donut{width:160px;height:160px;display:block;overflow:visible}
.slice{cursor:pointer;stroke:var(--card);stroke-width:2;transition:opacity .15s,transform .15s;transform-origin:80px 80px}
.slice:hover,.slice:focus-visible{opacity:.8;transform:scale(1.035);outline:none}
.slice.selected{stroke:var(--ink);stroke-width:3}
.donut-hole{fill:var(--card);pointer-events:none}
.donut-total{fill:var(--ink);font-size:13px;font-weight:700;text-anchor:middle}
.donut-label{fill:var(--mute);font-size:9px;text-anchor:middle}
.chart-legend{display:grid;gap:3px;min-width:0}
.legend-item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:7px;width:100%;padding:6px 4px;border:0;border-radius:6px;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.legend-item:hover,.legend-item.selected{background:var(--bg)}
.legend-dot{width:9px;height:9px;border-radius:50%}
.legend-value{color:var(--mute);font-variant-numeric:tabular-nums}
@media(max-width:380px){.chart-layout{grid-template-columns:132px minmax(0,1fr);gap:8px}.donut{width:132px;height:132px}.legend-item{font-size:12px;gap:5px;padding:5px 2px}}
@media(max-width:380px){.bill-row{gap:5px}.bill-amount input{width:72px}.bill-status{font-size:11px}}
.bottom-tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;display:grid;grid-template-columns:repeat(3,1fr);max-width:520px;margin:0 auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.bottom-tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;border-radius:10px;background:none;color:var(--mute);font:inherit;font-size:12px;cursor:pointer}
.bottom-tabs button span:first-child{font-size:20px;line-height:1}
.bottom-tabs button.on{color:var(--accText);font-weight:600;background:var(--bg)}
.fab{bottom:calc(82px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<main>
  <div class="top"><h1 id="title">Expenses</h1></div>
  <div id="exp">
    <div class="nav"><button id="prev" aria-label="Previous month">‹</button><b id="month"></b><button id="next" aria-label="Next month">›</button></div>
    <div class="total"><div class="n" id="total"></div><div class="l">spent this month</div></div>
    <div class="card" id="cats"></div>
    <div id="list"></div>
  </div>
  <div id="bills" style="display:none">
    <div class="nav"><button id="billPrev" aria-label="Previous month">‹</button><b id="billMonth"></b><button id="billNext" aria-label="Next month">›</button></div>
    <div class="total"><div class="n" id="billTotal"></div><div class="l">monthly bills</div></div>
    <div id="billDueSummary" class="bill-summary"></div>
    <div id="billList"></div>
  </div>
  <div id="notes">
    <textarea id="noteText" placeholder="Write bills, reminders or anything else here. It saves as you type." aria-label="Notes"></textarea>
    <div class="s" id="saved"></div>
  </div>
</main>
<button class="fab" id="add">Add expense</button>
<nav class="bottom-tabs" aria-label="Main navigation">
  <button id="tabB" type="button" aria-label="Utility" aria-selected="false"><span>▤</span><span>Utility</span></button>
  <button id="tabE" class="on" type="button" aria-label="Expenses" aria-selected="true"><span>◷</span><span>Expenses</span></button>
  <button id="tabN" type="button" aria-label="Notes" aria-selected="false"><span>✎</span><span>Notes</span></button>
</nav>

<div class="sheet-bg" id="bg">
  <div class="sheet" id="entrySheet" role="dialog" aria-label="Add expense">
    <input class="amt" id="amt" type="text" inputmode="decimal" placeholder="0" aria-label="Amount">
    <div id="categoryField"><label>Category</label><div class="chips" id="chips"></div></div>
    <label id="noteLabel" for="note">Note</label><input id="note" type="text" placeholder="What was it for?">
    <label id="dateLabel" for="date">Date</label><input id="date" type="date">
    <div id="dueDayField" style="display:none"><label for="dueDay">Due day of month</label><input id="dueDay" type="number" min="1" max="31" step="1" value="1"></div>
      <button class="save" id="save">Save expense</button>
    <button class="cancel" id="cancel">Cancel</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script>
const CUR="₹", CATS=["Food","Transport","Bills","Shopping","Health","Fun","Other"],
EMO={Food:"🍜",Transport:"🚌",Bills:"🧾",Shopping:"🛍️",Health:"💊",Fun:"🎬",Other:"✨"},
COL={Food:"#F6C9A8",Transport:"#B9D8F0",Bills:"#D9CBF0",Shopping:"#F4BFD0",Health:"#BFE5D0",Fun:"#F7E3A1",Other:"#D5DEDB"};
const KEY="expenses-v1", BILL_KEY="utility-bills-v2", OLD_BILL_KEY="utility-bills-v1";
let items=[], utilityBills=[], filt=null, shown=0, billShown=0, cat=CATS[0], view=new Date(); view.setDate(1);
const $=id=>document.getElementById(id);
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){items=[]}
try{
  const savedBills=localStorage.getItem(BILL_KEY);
  if(savedBills!==null)utilityBills=JSON.parse(savedBills)||[];
  else{
    utilityBills=(JSON.parse(localStorage.getItem(OLD_BILL_KEY)||"[]")||[]).map(b=>({id:b.id,name:b.name,startMonth:b.month,months:{[b.month]:{amount:b.amount,paid:false}}}));
    if(utilityBills.length)localStorage.setItem(BILL_KEY,JSON.stringify(utilityBills));
  }
}catch(e){utilityBills=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function persistBills(){try{localStorage.setItem(BILL_KEY,JSON.stringify(utilityBills))}catch(e){}}
const money=n=>CUR+n.toLocaleString("en-IN",{maximumFractionDigits:2});
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function countTo(t){const from=shown,st=performance.now();shown=t;
  (function f(n){const p=Math.min(1,(n-st)/450),e=1-Math.pow(1-p,3);$("total").textContent=money(Math.round((from+(t-from)*e)*100)/100);if(p<1)requestAnimationFrame(f)})(st)}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function render(){
  const ym=iso(view).slice(0,7);
  $("month").textContent=view.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  $("billMonth").textContent=$("month").textContent;
  const all=items.filter(e=>e.date.startsWith(ym));
  const total=all.reduce((s,e)=>s+e.amount,0);
  countTo(total);
  const by={};all.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amount);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  if(filt&&!by[filt])filt=null;
  $("cats").style.display=rows.length?"block":"none";
  if(rows.length){
    let angle=-Math.PI/2;
    const slices=rows.map(([c,v])=>{
      const start=angle;angle+=v/total*Math.PI*2;
      const percent=Math.round(v/total*100);
      return `<path class="slice${filt===c?" selected":""}" d="${piePath(start,angle)}" fill="${COL[c]||COL.Other}" data-c="${c}" role="button" tabindex="0" aria-label="Filter ${c}, ${money(v)}, ${percent}%" aria-pressed="${filt===c}"><title>${c}: ${money(v)} (${percent}%)</title></path>`;
    }).join("");
    const legend=rows.map(([c,v])=>`<button class="legend-item${filt===c?" selected":""}" data-c="${c}" aria-pressed="${filt===c}"><span class="legend-dot" style="background:${COL[c]||COL.Other}"></span><span>${c}</span><span class="legend-value">${money(v)}</span></button>`).join("");
    $("cats").innerHTML=`<h2 class="chart-head">Spending by category</h2><div class="chart-layout"><svg class="donut" viewBox="0 0 160 160" role="img" aria-label="Monthly spending by category">${slices}<circle class="donut-hole" cx="80" cy="80" r="43"></circle><text class="donut-total" x="80" y="78">${money(total)}</text><text class="donut-label" x="80" y="94">total spent</text></svg><div class="chart-legend">${legend}</div></div>`;
  }else $("cats").innerHTML="";
  renderBills();
  const list=all.filter(e=>!filt||e.cat===filt).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  if(!list.length){$("list").innerHTML='<div class="empty">No expenses this month.<br>Tap “Add expense” to log one.</div>';return}
  let html=filt?`<div class="filt"><span>Showing ${EMO[filt]} ${filt}</span><button id="clr">Show all</button></div>`:"",last="";
  list.forEach(e=>{
    if(e.date!==last){
      if(last)html+="</div>";
      last=e.date;
      const label=new Date(e.date+"T00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
      html+=`<h2>${label}</h2><div class="card" style="margin-bottom:0">`;
    }
    html+=`<div class="row"><div class="ico" style="background:${COL[e.cat]||COL.Other}">${EMO[e.cat]||"✨"}</div><div class="m"><div>${esc(e.note||e.cat)}</div><div>${e.cat}</div></div><div class="a">${money(e.amount)}</div><button class="x" data-id="${e.id}" aria-label="Delete expense">✕</button></div>`;
  });
  $("list").innerHTML=html+"</div>";
}

function piePath(start,end){
  const cx=80,cy=80,r=70;
  const point=angle=>[cx+r*Math.cos(angle),cy+r*Math.sin(angle)];
  const [sx,sy]=point(start),[ex,ey]=point(end);
  if(end-start>=Math.PI*2-0.0001){
    const [mx,my]=point(start+Math.PI);
    return `M ${sx} ${sy} A ${r} ${r} 0 1 1 ${mx} ${my} A ${r} ${r} 0 1 1 ${sx} ${sy} Z`;
  }
  return `M ${cx} ${cy} L ${sx} ${sy} A ${r} ${r} 0 ${end-start>Math.PI?1:0} 1 ${ex} ${ey} Z`;
}

function renderBills(){
  const ym=iso(view).slice(0,7);
  $("billMonth").textContent=view.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  const monthBills=utilityBills.filter(b=>b.startMonth<=ym).map(b=>({bill:b,...billState(b,ym)})).sort((a,b)=>a.bill.name.localeCompare(b.bill.name));
  const total=monthBills.reduce((sum,b)=>sum+b.amount,0);
  const unpaid=monthBills.filter(b=>!b.paid);
  const unpaidTotal=unpaid.reduce((sum,b)=>sum+b.amount,0);
  const overdueTotal=unpaid.reduce((sum,b)=>sum+(billDueInfo(b.bill,ym).overdue?b.amount:0),0);
  $("billDueSummary").innerHTML=`<strong>${money(unpaidTotal)}</strong> unpaid across ${unpaid.length} ${unpaid.length===1?"bill":"bills"}${overdueTotal?` · <strong>${money(overdueTotal)}</strong> overdue`:""}`;
  const from=billShown,st=performance.now();billShown=total;
  (function f(now){const p=Math.min(1,(now-st)/450),e=1-Math.pow(1-p,3);$("billTotal").textContent=money(Math.round((from+(total-from)*e)*100)/100);if(p<1)requestAnimationFrame(f)})(st);
  if(!monthBills.length){$("billList").innerHTML='<div class="empty">No monthly bills yet.<br>Add a bill to start tracking it.</div>';return}
  $("billList").innerHTML='<div class="card" style="margin-bottom:0">'+monthBills.map(b=>{const due=billDueInfo(b.bill,ym);return `<div class="row bill-row"><div class="bill-status" role="radiogroup" aria-label="${esc(b.bill.name)} status"><label><input type="radio" name="bill-status-${b.bill.id}" value="paid" data-bill-status="paid" data-bill-id="${b.bill.id}"${b.paid?' checked':''}>Paid</label><label><input type="radio" name="bill-status-${b.bill.id}" value="due" data-bill-status="due" data-bill-id="${b.bill.id}"${b.paid?'':' checked'}>Due</label></div><div class="m"><div>${esc(b.bill.name)}</div><div class="bill-meta${!b.paid&&due.overdue?' overdue':''}">${b.paid?'Paid':due.overdue?'Overdue':`Due ${due.label}`}</div></div><label class="bill-amount"><span>₹</span><input type="number" min="0" step="0.01" value="${b.amount}" aria-label="${esc(b.bill.name)} amount" data-bill-amount data-bill-id="${b.bill.id}"></label><button class="x" data-bill-delete="${b.bill.id}" aria-label="Delete ${esc(b.bill.name)}">✕</button></div>`}).join("")+'</div>';
}

function billDueInfo(b,ym){
  const [year,month]=ym.split("-").map(Number);
  const lastDay=new Date(year,month,0).getDate();
  const dueDay=Math.min(Math.max(Number(b.dueDay)||1,1),lastDay);
  const dueDate=new Date(year,month-1,dueDay);
  const today=new Date();today.setHours(0,0,0,0);
  const currentMonth=iso(today).slice(0,7);
  return {label:dueDate.toLocaleDateString("en-IN",{day:"numeric",month:"short"}),overdue:ym<currentMonth||(ym===currentMonth&&dueDate<today)};
}

function billState(b,ym){
  const month=Object.keys(b.months).filter(key=>key<=ym).sort().pop();
  const record=month&&b.months[month];
  return {amount:record?.amount||0,paid:month===ym&&!!record?.paid};
}

function chips(){
  $("chips").innerHTML=CATS.map(c=>`<button class="chip${c===cat?" on":""}" data-c="${c}">${EMO[c]} ${c}</button>`).join("");
}
function openSheet(){
  $("entrySheet").dataset.kind="expense";
  $("entrySheet").setAttribute("aria-label","Add expense");
  $("categoryField").style.display="block";$("noteLabel").textContent="Note";$("note").placeholder="What was it for?";
  $("dateLabel").textContent="Date";$("date").type="date";$("date").value=iso(new Date());$("save").textContent="Save expense";
  $("dueDayField").style.display="none";
  $("amt").value="";$("note").value="";$("date").value=iso(new Date());cat=CATS[0];chips();
  chk();$("bg").classList.add("on");setTimeout(()=>$("amt").focus(),50);
}
function openBillSheet(){
  $("entrySheet").dataset.kind="bill";
  $("entrySheet").setAttribute("aria-label","Add monthly bill");
  $("categoryField").style.display="none";$("noteLabel").textContent="Utility";$("note").placeholder="Electricity, water, internet…";
  $("dateLabel").textContent="Starts in";$("date").type="month";$("date").value=iso(view).slice(0,7);
  $("dueDayField").style.display="block";$("dueDay").value="1";
  $("save").textContent="Add monthly bill";$("amt").value="";$("note").value="";
  chk();$("bg").classList.add("on");setTimeout(()=>$ ("amt").focus(),50);
}
function chk(){$("save").classList.toggle("ready",parseFloat($("amt").value.replace(",","."))>0)}
$("amt").oninput=chk;
function closeSheet(){$("bg").classList.remove("on")}

$("add").onclick=openSheet;
$("cancel").onclick=closeSheet;
$("bg").onclick=e=>{if(e.target===$("bg"))closeSheet()};
$("chips").onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;chips()}};
$("save").onclick=()=>{
  const amount=parseFloat($("amt").value.replace(",","."));
  if(!(amount>0)){$("amt").focus();return}
  if($("entrySheet").dataset.kind==="bill"){
    const month=$("date").value||iso(new Date()).slice(0,7);
    const name=$("note").value.trim();
    if(!name){$("note").focus();return}
    const dueDay=Math.min(31,Math.max(1,parseInt($("dueDay").value,10)||1));
    utilityBills.push({id:Date.now(),name,startMonth:month,dueDay,months:{[month]:{amount,paid:false}}});
    persistBills();closeSheet();toast("Utility bill saved ✓");
    view=new Date(month+"-01T00:00");render();return;
  }
  const date=$("date").value||iso(new Date());
  items.push({id:Date.now(),amount,cat,note:$("note").value.trim(),date});
  persist();closeSheet();toast("Expense saved ✓");
  view=new Date(date+"T00:00");view.setDate(1);render();
};
$("list").onclick=e=>{
  if(e.target.id==="clr"){filt=null;render();return}
  const id=e.target.dataset.id;
  if(id&&confirm("Delete this expense?")){e.target.closest(".row").classList.add("out");setTimeout(()=>{items=items.filter(x=>String(x.id)!==id);persist();render();toast("Deleted")},250)}
};
$("cats").onclick=e=>{const target=e.target.closest("[data-c]");if(target){filt=filt===target.dataset.c?null:target.dataset.c;render()}};
$("cats").onkeydown=e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".slice")){e.preventDefault();filt=filt===e.target.dataset.c?null:e.target.dataset.c;render()}
};
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$("next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$("billPrev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$("billNext").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$("billList").onclick=e=>{
  const id=e.target.dataset.billDelete;
  if(id&&confirm("Delete this monthly bill?")){
    e.target.closest(".row").classList.add("out");
    setTimeout(()=>{utilityBills=utilityBills.filter(b=>String(b.id)!==id);persistBills();renderBills();toast("Deleted")},250);
  }
};
$("billList").onchange=e=>{
  const id=e.target.dataset.billId;
  if(!id)return;
  const bill=utilityBills.find(b=>String(b.id)===id);
  if(!bill)return;
  const ym=iso(view).slice(0,7),state=billState(bill,ym);
  if(e.target.hasAttribute("data-bill-amount")){
    const amount=parseFloat(e.target.value);
    if(!Number.isFinite(amount)||amount<0){renderBills();return}
    bill.months[ym]={amount,paid:state.paid};
  }else if(e.target.hasAttribute("data-bill-status")){
    bill.months[ym]={amount:state.amount,paid:e.target.value==="paid"};
  }else return;
  persistBills();renderBills();
};
function tab(n){
  $("exp").style.display=n===0?"block":"none";
  $("bills").style.display=n===1?"block":"none";
  $("notes").style.display=n===2?"block":"none";
  $("add").style.display=n===2?"none":"block";
  $("add").textContent=n===1?"Add monthly bill":"Add expense";
  $("add").onclick=n===1?openBillSheet:openSheet;
  $("title").textContent=n===1?"Utility Bills":n===2?"Notes":"Expenses";
  $("tabE").classList.toggle("on",n===0);$("tabB").classList.toggle("on",n===1);$("tabN").classList.toggle("on",n===2);
  $("tabB").setAttribute("aria-selected",String(n===1));
  $("tabE").setAttribute("aria-selected",String(n===0));
  $("tabN").setAttribute("aria-selected",String(n===2));
  $("prev").parentElement.style.display=n===2?"none":"flex";
  $("billPrev").parentElement.style.display=n===1?"flex":"none";
}
$("tabE").onclick=()=>tab(0);
$("tabB").onclick=()=>tab(1);
$("tabN").onclick=()=>tab(2);
try{$("noteText").value=localStorage.getItem("notes-v1")||""}catch(e){}
let nt;
$("noteText").oninput=()=>{
  $("saved").textContent="Saving…";clearTimeout(nt);
  nt=setTimeout(()=>{try{localStorage.setItem("notes-v1",$("noteText").value);$("saved").textContent="Saved"}catch(e){$("saved").textContent="Could not save"}},400);
};
render();
tab(0);
</script>
</body>
</html>
