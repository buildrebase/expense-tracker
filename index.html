<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="theme-color" content="#2F7A64">
<title>Expenses</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/home-icon-180.png">
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="stylesheet" href="src/styles.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="src/app.js"></script>
</head>
<body>
<div class="auth-gate" id="authGate">
  <form class="auth-panel" id="authForm">
    <h2 id="authHeading">Sign in</h2>
    <p>Sign in with your username and password.</p>
    <div id="authNameField"><label for="authName">Your name</label><input id="authName" type="text" autocomplete="name" maxlength="80"></div>
    <label for="authUsername">Username</label><input id="authUsername" type="text" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" required>
    <label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required>
    <button id="authSubmit" type="submit">Sign in</button>
    <button class="secondary" id="authToggle" type="button">Create an account</button>
    <button class="secondary" id="forgotPassword" type="button">Forgot password?</button>
    <div class="auth-status" id="authStatus" role="status"></div>
  </form>
  <form class="auth-panel" id="resetForm" hidden>
    <h2>Set a new password</h2>
    <label for="resetPassword">New password</label><input id="resetPassword" type="password" autocomplete="new-password" minlength="6" required>
    <label for="resetPasswordConfirm">Confirm new password</label><input id="resetPasswordConfirm" type="password" autocomplete="new-password" minlength="6" required>
    <button type="submit">Update password</button>
    <button class="secondary" id="cancelReset" type="button">Back to sign in</button>
    <div class="auth-status" id="resetStatus" role="status"></div>
  </form>
</div>
<main>
  <div class="top"><div class="brand"><img class="brand-mark" src="assets/logo.svg" alt=""><h1 id="title">Expenses</h1></div><div class="cloud-actions"><button class="identity" id="userName" type="button" title="Edit display name"></button><span id="syncStatus">Local only</span><button id="signOut" type="button">Sign out</button></div></div>
  <div id="exp">
    <div class="nav"><button id="prev" aria-label="Previous month">‹</button><b id="month"></b><button id="next" aria-label="Next month">›</button></div>
    <div class="total"><div class="n" id="total"></div><div class="l">spent this month</div></div>
    <div class="card" id="cats"></div>
    <div id="list"></div>
  </div>
  <div id="bills">
    <div class="nav"><button id="billPrev" aria-label="Previous month">‹</button><b id="billMonth"></b><button id="billNext" aria-label="Next month">›</button></div>
    <div class="total"><div class="n" id="billTotal"></div><div class="l">monthly bills</div></div>
    <div id="billDueSummary" class="bill-summary"></div>
    <div id="billList"></div>
  </div>
  <div id="notes">
    <textarea id="noteText" placeholder="Write bills, reminders or anything else here. It saves as you type." aria-label="Notes"></textarea>
    <div class="s" id="saved"></div>
  </div>
  <div id="budget">
    <div class="nav"><button id="budgetPrev" aria-label="Previous month">‹</button><b id="budgetMonth"></b><button id="budgetNext" aria-label="Next month">›</button></div>
    <div class="total"><div class="n" id="budgetSpent"></div><div class="l">spent this month</div></div>
    <div class="card" id="budgetSummary"></div>
    <div id="budgetList"></div>
  </div>
</main>
<button class="fab" id="add">Add expense</button>
<nav class="bottom-tabs" aria-label="Main navigation">
  <button id="tabB" type="button" aria-label="Utility" aria-selected="false"><span>▤</span><span>Utility</span></button>
  <button id="tabE" class="on" type="button" aria-label="Expenses" aria-selected="true"><span>◷</span><span>Expenses</span></button>
  <button id="tabBudget" type="button" aria-label="Budget" aria-selected="false"><span>％</span><span>Budget</span></button>
  <button id="tabN" type="button" aria-label="Notes" aria-selected="false"><span>✎</span><span>Notes</span></button>
</nav>

<div class="sheet-bg" id="bg">
  <div class="sheet" id="entrySheet" role="dialog" aria-label="Add expense">
    <input class="amt" id="amt" type="text" inputmode="decimal" placeholder="0" aria-label="Amount">
    <div id="categoryField"><label>Category</label><div class="chips" id="chips"></div><label for="customCategory">Add a category</label><div class="category-entry"><input id="customCategory" type="text" maxlength="32" placeholder="e.g. Pets"><button id="addCategory" type="button">Add</button></div></div>
    <label id="noteLabel" for="note">Note</label><input id="note" type="text" placeholder="What was it for?">
    <label id="dateLabel" for="date">Date</label><input id="date" type="date">
    <div id="dueDayField"><label for="dueDay">Due day of month</label><input id="dueDay" type="number" min="1" max="31" step="1" value="1"></div>
    <button class="save" id="save">Save expense</button>
    <button class="cancel" id="cancel">Cancel</button>
  </div>
</div>

<div class="sheet-bg" id="budgetBg">
  <form class="sheet" id="budgetForm" role="dialog" aria-label="Set monthly budget">
    <h2>Monthly budget</h2>
    <label for="budgetFormMonth">Month</label><input id="budgetFormMonth" type="month" required>
    <label for="budgetCategory">Budget for</label><select id="budgetCategory" required></select>
    <label for="budgetAmount">Limit</label><input id="budgetAmount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0" required>
    <button class="save" type="submit">Save budget</button>
    <button class="cancel" id="budgetCancel" type="button">Cancel</button>
  </form>
</div>

<div class="toast" id="toast" role="status"></div>
</body>
</html>
